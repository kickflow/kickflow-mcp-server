name: CI

on:
  pull_request:
  push:
    branches:
      - 'chore/bump-version-*' # Update Version がデプロイキーで push するブランチ。GITHUB_TOKEN が作る PR では pull_request が発火しないため push 側で必須チェックを満たす
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Format & Lint & Type check
        run: vp check

      - name: Build
        run: vp pack

      - name: Test
        run: vp test
