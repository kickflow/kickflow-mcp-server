name: Update Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch all tags
        run: git fetch --tags

      - name: Update package.json version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.version.outputs.new_version }}'
          add-paths: |
            package.json
            package-lock.json
          title: 'chore: bump version to ${{ steps.version.outputs.new_version }}'
          body: |
            This PR was automatically created by the Update Version workflow.

            Bump type: `${{ github.event.inputs.version }}`

            ## Release steps
            1. Wait for CI to pass, then merge this PR manually.
               Auto-merge is not used because a merge performed by `GITHUB_TOKEN` does not trigger other workflows.
            2. The Create Draft Release workflow creates a draft release `v${{ steps.version.outputs.new_version }}` on push to `main`.
            3. Review the release notes and publish the release to trigger the npm publish.
          branch: chore/bump-version-${{ steps.version.outputs.new_version }}
          base: main
          delete-branch: true
